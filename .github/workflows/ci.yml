name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@v4
        with:
          go-version: '1.19'
      - run: go test -v -coverprofile=coverage.txt -covermode=atomic
      - uses: codecov/codecov-action@v3
